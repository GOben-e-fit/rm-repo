name: metric-contracts-validate
on:
  push:
    paths:
      - "kpi-enterprise/contracts/metric-contracts/**"
      - ".github/workflows/metric-contracts-validate.yml"
  pull_request:
    paths:
      - "kpi-enterprise/contracts/metric-contracts/**"
      - ".github/workflows/metric-contracts-validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kpi-enterprise/contracts/metric-contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install jsonschema pyyaml
      - name: Validate contracts
        run: python validate.py
