[project]
name = "kpi-discovery"
version = "0.1.0"
description = "Heuristic KPI discovery: profile dataset columns and propose candidate KPIs."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
