[project]
name = "kpi-agents-orchestrator"
version = "0.1.0"
description = "FastAPI orchestrator implementing the KPI Enterprise Mining v1 OpenAPI"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "python-jose[cryptography]>=3.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
