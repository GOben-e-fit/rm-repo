server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /health {
        add_header Content-Type "application/json";
        return 200 '{"status":"ok","service":"kpi-mining","mode":"static-plus-agent-proxy"}';
    }

    location = /api/health {
        try_files /api/health.json @agent_api;
    }

    location = /openapi.json {
        add_header Cache-Control "public, max-age=300";
        try_files /openapi.json =404;
    }

    location /api/v1/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-Id, X-Trace-Id" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri.json @agent_api;
    }

    location /api/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Tenant-Id, X-Trace-Id" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
        try_files $uri $uri.json @agent_api;
    }

    location @agent_api {
        set $orch "agents-orchestrator";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$orch:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Tenant-Id $http_x_tenant_id;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    location /enterprise {
        alias /usr/share/nginx/html/enterprise;
        try_files $uri $uri/ /enterprise/index.html;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
